name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # Set up bun as the canonical package manager (Q6/AC10)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#bunx-nxcloud-startcirun
      - run: bunx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache the bun install cache, keyed on the bun lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-install-

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps

      # Prepend any command with "bunx nx record --" to record its logs to Nx Cloud
      # Gate scope: MVP projects only (user decision 2026-09-07). The frozen
      # `packages/*` Angular experiment is excluded from lint/test/build/typecheck/
      # e2e/format:check. See docs/specs/ai-saas-mvp/apply-progress.md.
      - run: bunx nx record -- bunx nx format:check --base="remotes/origin/main" --projects=api,dashboard,landing,identity-cms,contracts
      - run: bunx nx run-many -t lint test build typecheck e2e --projects=api,dashboard,landing,identity-cms,contracts
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: bunx nx fix-ci
        if: always()
